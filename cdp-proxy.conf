# CDP front door for Railway's private network. Chromium answers 500 "Host header
# is specified and is not an IP address or localhost" to any other Host, so a
# client dialling chromium.railway.internal:9222 is refused. This rewrites the
# Host header to localhost on the way in, and the webSocketDebuggerUrl that
# /json/* hands back to the Host the client used, so Playwright/Puppeteer follow
# it to the same name. No public domain targets this port.
pid /tmp/cdp-nginx.pid;
error_log stderr warn;
events {}
http {
    access_log off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 9222;
        listen [::]:9222;
        location / {
            proxy_pass http://127.0.0.1:9223;
            proxy_http_version 1.1;
            proxy_set_header Host localhost;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Accept-Encoding "";
            proxy_read_timeout 1d;
            sub_filter_types application/json text/plain;
            sub_filter_once off;
            sub_filter 'ws://localhost' 'ws://$http_host';
            sub_filter 'ws://127.0.0.1:9223' 'ws://$http_host';
            sub_filter 'localhost:9223' '$http_host';
        }
    }
}
